<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | Cardápio Digital</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <h1>Painel do Administrador</h1>
      <p>Gerencie produtos e disponibilidade do cardápio.</p>
      <a class="admin-link" href="index.html">Voltar para pedidos</a>
    </header>

    <main class="container single-column">
      <section id="admin-login" class="admin-section">
        <h2>Login</h2>
        <p class="muted-text">Acesso restrito ao administrador.</p>
        <form id="admin-login-form" class="admin-form">
          <label for="admin-username">Usuário</label>
          <input id="admin-username" type="text" required />

          <label for="admin-password">Senha</label>
          <input id="admin-password" type="password" required />

          <button type="submit">Entrar</button>
        </form>
      </section>

      <section id="admin-panel" class="admin-section hidden">
        <h2>Produtos</h2>
        <p id="admin-source" class="muted-text"></p>

        <form id="admin-product-form" class="admin-form">
          <input id="admin-product-id" type="hidden" />

          <label for="admin-product-name">Nome do produto</label>
          <input id="admin-product-name" type="text" placeholder="Ex.: X-Salada" required />

          <label for="admin-product-price">Preço</label>
          <input id="admin-product-price" type="number" min="0" step="0.01" placeholder="0,00" required />

          <label for="admin-product-image">URL da imagem</label>
          <input id="admin-product-image" type="url" placeholder="https://..." />

          <label class="inline-checkbox" for="admin-product-active">
            <input id="admin-product-active" type="checkbox" checked /> Produto ativo
          </label>

          <div class="admin-actions">
            <button type="submit">Salvar produto</button>
            <button id="admin-cancel-edit" class="secondary-button" type="button">Cancelar edição</button>
            <button id="admin-logout" class="secondary-button" type="button">Sair</button>
          </div>
        </form>

        <ul id="admin-products-list" class="admin-products-list"></ul>
      </section>
    </main>

    <script src="admin.js"></script>
  </body>
</html>
